name: Restore complete source once
on:
  push:
    paths: ['.github/workflows/restore-source.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-complete-source
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source and preserve workflow permissions
        run: |
          test -f meeple-corner-complete-source.zip
          unzip -o meeple-corner-complete-source.zip
          git restore .github/workflows/deploy-pages.yml
          git rm --ignore-unmatch meeple-corner-complete-source.zip meeple-corner-github-source-v4.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: restore complete static catalog and interaction source"
          git push origin HEAD:main
