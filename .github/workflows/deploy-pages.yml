name: Deploy board-game website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --include=optional
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate responsive covers
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/optimize-covers.py
      - run: npm run catalog:validate
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Build static frontend
        run: npm run build:pages
        env:
          VITE_API_BASE: https://meeple-corner-api.812097204.workers.dev
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
